name: Typecheck

# Type checks run here, not in `npm run build`: tsc needs over 1 GB of memory,
# which stalls builds on the VPS.
on:
  push:
    branches: [logic]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
